<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadex</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b1020;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#10182f;
  border-bottom:1px solid rgba(255,255,255,0.08);
  padding:14px 20px;
}

.topbar{
  max-width:1400px;
  margin:auto;
  display:flex;
  gap:20px;
  align-items:center;
}

.logo{
  font-size:2rem;
  font-weight:900;
  color:#7c8cff;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1a2547;
  color:white;
  font-size:1rem;
}

main{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.top-game{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  background:#11192f;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
}

.top-game img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.top-info{
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.top-info h2{
  font-size:2.5rem;
  margin-bottom:10px;
}

.top-info p{
  color:#b6bdd3;
  line-height:1.6;
  margin-bottom:20px;
}

.play-btn{
  padding:14px;
  border:none;
  border-radius:12px;
  background:#5865f2;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:1rem;
}

.play-btn:hover{
  background:#7380ff;
}

.vote-box{
  display:flex;
  gap:15px;
  margin-top:20px;
}

.vote{
  flex:1;
  background:#1a2547;
  padding:14px;
  border-radius:14px;
  text-align:center;
}

.vote h3{
  font-size:1.6rem;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

.game-card{
  background:#11192f;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  transition:0.15s;
}

.game-card:hover{
  transform:translateY(-4px);
}

.game-card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-content{
  padding:14px;
}

.card-content h3{
  margin-bottom:10px;
}

.rating-row{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  color:#b6bdd3;
  font-size:0.95rem;
}

.like{
  color:#4ade80;
}

.dislike{
  color:#f87171;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-content{
  width:95%;
  height:92%;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-top{
  background:#11192f;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

iframe{
  flex:1;
  border:none;
}

.close-btn{
  background:#ef4444;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

@media(max-width:900px){
  .top-game{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<div class="modal" id="gameModal">

    </div>

    <iframe id="gameFrame"></iframe>
  </div>
