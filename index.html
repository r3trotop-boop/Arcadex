<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadex</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b1020;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#10182f;
  border-bottom:1px solid rgba(255,255,255,0.08);
  padding:14px 20px;
}

.topbar{
  max-width:1400px;
  margin:auto;
  display:flex;
  gap:20px;
  align-items:center;
}

.logo{
  font-size:2rem;
  font-weight:900;
  color:#7c8cff;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1a2547;
  color:white;
  font-size:1rem;
}

main{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.top-game{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  background:#11192f;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
}

.top-game img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.top-info{
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.top-info h2{
  font-size:2.5rem;
  margin-bottom:10px;
}

.top-info p{
  color:#b6bdd3;
  line-height:1.6;
  margin-bottom:20px;
}

.play-btn{
  padding:14px;
  border:none;
  border-radius:12px;
  background:#5865f2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.play-btn:hover{
  background:#7380ff;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

.game-card{
  background:#11192f;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  transition:0.15s;
}

.game-card:hover{
  transform:translateY(-4px);
}

.game-card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-content{
  padding:14px;
}

.card-content h3{
  margin-bottom:10px;
}

.rating-row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.like-btn, .dislike-btn{
  flex:1;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  background:#1a2547;
  color:white;
}

.like-btn:hover{ background:#1f3d2a; }
.dislike-btn:hover{ background:#3d1f1f; }

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-content{
  width:95%;
  height:92%;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-top{
  background:#11192f;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

iframe{
  flex:1;
  border:none;
}

.close-btn{
  background:#ef4444;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="topbar">
    <div class="logo">Arcadex</div>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Search games...">
    </div>
  </div>
</header>

<main>

<section class="games-grid" id="gamesGrid">

  <!-- SLOPE -->
  <div class="game-card">
    <img src="https://images.crazygames.com/games/slope/cover-1589733217181.png">
    <div class="card-content">
      <h3>Slope</h3>
      <button class="play-btn" onclick="openGame('https://example.com')">Play</button>

      <div class="rating-row">
        <button class="like-btn" onclick="vote('slope','like')">
          👍 <span id="like-slope">0</span>
        </button>
        <button class="dislike-btn" onclick="vote('slope','dislike')">
          👎 <span id="dislike-slope">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 1V1 LOL -->
  <div class="game-card">
    <img src="https://images.crazygames.com/games/1v1-lol/cover-1589887571080.png">
    <div class="card-content">
      <h3>1v1.LOL</h3>
      <button class="play-btn" onclick="openGame('https://example.com')">Play</button>

      <div class="rating-row">
        <button class="like-btn" onclick="vote('lol','like')">
          👍 <span id="like-lol">0</span>
        </button>
        <button class="dislike-btn" onclick="vote('lol','dislike')">
          👎 <span id="dislike-lol">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- RETRO BOWL -->
  <div class="game-card">
    <img src="https://images.crazygames.com/games/retro-bowl/cover-1674133099913.png">
    <div class="card-content">
      <h3>Retro Bowl</h3>
      <button class="play-btn" onclick="openGame('https://example.com')">Play</button>

      <div class="rating-row">
        <button class="like-btn" onclick="vote('retro','like')">
          👍 <span id="like-retro">0</span>
        </button>
        <button class="dislike-btn" onclick="vote('retro','dislike')">
          👎 <span id="dislike-retro">0</span>
        </button>
      </div>
    </div>
  </div>

</section>

</main>

<!-- MODAL -->
<div class="modal" id="gameModal">
  <div class="modal-content">
    <div class="modal-top">
      <h3>Arcadex</h3>
      <button class="close-btn" onclick="closeGame()">Close</button>
    </div>
    <iframe id="gameFrame"></iframe>
  </div>
</div>

<script>
// SEARCH
const searchInput = document.getElementById('searchInput');
const cards = document.querySelectorAll('.game-card');

searchInput.addEventListener('input', function () {
  const value = this.value.toLowerCase();

  cards.forEach(card => {
    const title = card.querySelector('h3').innerText.toLowerCase();
    card.style.display = title.includes(value) ? 'block' : 'none';
  });
});

// MODAL
const modal = document.getElementById('gameModal');
const frame = document.getElementById('gameFrame');

function openGame(url){
  frame.src = url;
  modal.style.display = "flex";
}

function closeGame(){
  modal.style.display = "none";
  frame.src = "";
}

modal.addEventListener('click', (e)=>{
  if(e.target === modal) closeGame();
});

// VOTING SYSTEM (REAL LOCAL STORAGE)
function getVotes(game){
  return JSON.parse(localStorage.getItem("votes_" + game)) || {like:0, dislike:0};
}

function saveVotes(game, data){
  localStorage.setItem("votes_" + game, JSON.stringify(data));
  updateUI(game);
}

function vote(game, type){
  let data = getVotes(game);
  data[type] += 1;
  saveVotes(game, data);
}

function updateUI(game){
  let data = getVotes(game);

  let likeEl = document.getElementById("like-" + game);
  let dislikeEl = document.getElementById("dislike-" + game);

  if(likeEl) likeEl.innerText = data.like;
  if(dislikeEl) dislikeEl.innerText = data.dislike;
}

// INIT
["slope","lol","retro"].forEach(updateUI);
</script>

</body>
</html>
